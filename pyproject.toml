[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-eval"
version = "2.26.0"
description = "Evaluation toolkit for depth, RGB, ray and 3D point-map predictions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com"}
]
keywords = [
    "depth",
    "depth-estimation",
    "evaluation",
    "metrics",
    "benchmark",
    "computer-vision",
    "point-cloud",
    "lidar",
    "3d",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "Pillow>=8.0.0",
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "opencv-python-headless>=4.5.0",
    "lpips>=0.1.4",
    "torchmetrics>=1.0",
    "tqdm>=4.62.0",
    "euler-loading>=2.15",
    "ds-crawler>=2.10",
    "euler-metric-naming>=0.2",
]

[project.urls]
Homepage = "https://github.com/d-rothen/euler-eval"
Repository = "https://github.com/d-rothen/euler-eval"
Issues = "https://github.com/d-rothen/euler-eval/issues"
Documentation = "https://github.com/d-rothen/euler-eval/tree/main/docs"

[project.optional-dependencies]
logging = [
    "euler-train>=2.11",
]
fid = [
    "clean-fid>=0.1.35",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "ruff>=0.2",  # [tool.ruff.lint] configuration requires 0.2+
]

[project.scripts]
euler-eval = "euler_eval.cli:main"
"euler-eval.init" = "init_cache:main"

[tool.setuptools]
py-modules = ["init_cache"]

[tool.setuptools.package-data]
euler_eval = ["THIRD_PARTY_NOTICES.md"]

[tool.uv.sources]
ds-crawler = { git = "https://github.com/d-rothen/ds-crawler" }
euler-loading = { git = "https://github.com/d-rothen/euler-loading" }
euler-train = { git = "https://github.com/d-rothen/euler-train" }
euler-metric-naming = { git = "https://github.com/d-rothen/euler-metric-naming" }

[tool.setuptools.packages.find]
where = ["."]
include = ["euler_eval*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    # Camera matrices, rotations and translations keep their conventional
    # mathematical names (K, R, T, P) rather than snake_case, and
    # `torch.nn.functional as F` is universal.
    "N803",
    "N806",
    "N812",
]

[tool.ruff.lint.isort]
# Keep aliased imports from one module in a single statement.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # test names mirror the symbols they exercise (sample_K)
